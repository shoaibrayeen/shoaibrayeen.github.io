name: Tests

# Runs the Vitest suite on every push to master_revamp, in parallel with the
# deploy workflow. Deliberately NOT a deploy gate: a red run here is a signal
# to investigate, not a blocked release (see CLAUDE.md → Tests required).
on:
  push:
    branches: [master_revamp]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      # test:ci excludes the src/test/ui-*.test.tsx suites (generated shadcn/
      # Radix primitives, mostly unused by the site). Their popper-positioned
      # components (Tooltip/Popover/Select/menus) are pathologically slow in
      # jsdom on shared runners — 20-60s per test vs milliseconds locally, up
      # to wedged workers ("Timeout calling onTaskUpdate") — while testing
      # library behavior, not site behavior. The full suite (`npm test`)
      # remains the local pre-push gate.
      - name: Test (site suites)
        run: npm run test:ci
