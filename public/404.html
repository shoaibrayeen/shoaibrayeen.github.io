<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Redirecting...</title>
    <script>
      // Single Page App redirect for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: linear-gradient(135deg, #f0fdfa 0%, #ffffff 50%, #ecfeff 100%);
        color: #374151;
        text-align: center;
      }
      .spinner {
        width: 44px;
        height: 44px;
        margin: 0 auto 20px;
        border: 4px solid #ccfbf1;
        border-top-color: #0d9488;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        margin: 0 0 8px;
        background: linear-gradient(to right, #0d9488, #0891b2);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      p { font-size: 0.9rem; color: #6b7280; margin: 0; }
    </style>
  </head>
  <body>
    <div>
      <div class="spinner"></div>
      <h1>Taking you to shoaibrayeen.github.io</h1>
      <p>Redirecting you to the right page&hellip;</p>
    </div>
  </body>
</html>
