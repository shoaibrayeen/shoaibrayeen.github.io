<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1010" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#8a8a8a"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0d9488"/>
    </marker>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d9488"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
  </defs>

  <rect width="1040" height="1010" fill="#ffffff"/>

  <!-- Header -->
  <circle cx="41" cy="39" r="17" fill="url(#brand)"/>
  <text x="41" y="45" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">S</text>
  <text x="70" y="46" font-size="22" font-weight="700" fill="#1a1a1a">shoaibrayeen.github.io — Architecture Flow</text>
  <text x="70" y="64" font-size="12" fill="#8a8a8a">Static React portfolio on GitHub Pages (user site at /) · keep in sync with architecture.md</text>

  <!-- ============ Band 1: Build and Deploy ============ -->
  <rect x="20" y="86" width="1000" height="150" rx="12" fill="#fafafa" stroke="#e6e6e6"/>
  <text x="36" y="112" font-size="15" font-weight="700" fill="#0d9488">1 · BUILD &amp; DEPLOY</text>

  <rect x="40" y="136" width="170" height="62" rx="8" fill="#ffffff" stroke="#c9c9c9"/>
  <text x="125" y="160" font-size="13" font-weight="600" fill="#333" text-anchor="middle">Developer</text>
  <text x="125" y="177" font-size="11" fill="#b45309" text-anchor="middle">push → master_revamp ⚠</text>
  <text x="125" y="191" font-size="9.5" fill="#999" text-anchor="middle">(pushing master does NOT deploy)</text>

  <line x1="210" y1="167" x2="268" y2="167" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="239" y="158" font-size="10" fill="#8a8a8a" text-anchor="middle">trigger</text>

  <rect x="270" y="128" width="440" height="80" rx="8" fill="#ffffff" stroke="#c9c9c9"/>
  <text x="490" y="150" font-size="13" font-weight="600" fill="#333" text-anchor="middle">GitHub Actions · deploy.yml (Node 24)</text>
  <rect x="282" y="162" width="98" height="30" rx="15" fill="#f2f2f2" stroke="#dddddd"/>
  <text x="331" y="181" font-size="11" fill="#555" text-anchor="middle">npm install</text>
  <line x1="380" y1="177" x2="394" y2="177" stroke="#8a8a8a" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="396" y="162" width="84" height="30" rx="15" fill="#f2f2f2" stroke="#dddddd"/>
  <text x="438" y="181" font-size="11" fill="#555" text-anchor="middle">npm test</text>
  <line x1="480" y1="177" x2="494" y2="177" stroke="#8a8a8a" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="496" y="162" width="88" height="30" rx="15" fill="#f2f2f2" stroke="#dddddd"/>
  <text x="540" y="181" font-size="11" fill="#555" text-anchor="middle">vite build</text>
  <line x1="584" y1="177" x2="598" y2="177" stroke="#8a8a8a" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="600" y="162" width="98" height="30" rx="15" fill="#f2f2f2" stroke="#dddddd"/>
  <text x="649" y="181" font-size="11" fill="#555" text-anchor="middle">deploy dist/</text>
  <text x="490" y="222" font-size="9.5" fill="#999" text-anchor="middle">no lockfile committed · tests gate the deploy</text>

  <line x1="710" y1="167" x2="768" y2="167" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="770" y="136" width="220" height="62" rx="8" fill="#f0fdfa" stroke="#0d9488"/>
  <text x="880" y="162" font-size="13" font-weight="600" fill="#0f766e" text-anchor="middle">GitHub Pages</text>
  <text x="880" y="180" font-size="11" fill="#4d9a94" text-anchor="middle">shoaibrayeen.github.io/ (root)</text>

  <!-- ============ Band 2: Request flow ============ -->
  <rect x="20" y="256" width="1000" height="230" rx="12" fill="#fafafa" stroke="#e6e6e6"/>
  <text x="36" y="282" font-size="15" font-weight="700" fill="#0d9488">2 · REQUEST FLOW (SPA deep links on Pages)</text>

  <rect x="40" y="330" width="140" height="90" rx="8" fill="#ffffff" stroke="#c9c9c9"/>
  <text x="110" y="370" font-size="13" font-weight="600" fill="#333" text-anchor="middle">Browser</text>
  <text x="110" y="388" font-size="11" fill="#777" text-anchor="middle">user request</text>

  <line x1="180" y1="352" x2="428" y2="322" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="300" y="322" font-size="10.5" fill="#8a8a8a" text-anchor="middle">GET /  →  200 OK</text>

  <line x1="180" y1="398" x2="278" y2="426" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="110" y="440" font-size="10.5" fill="#8a8a8a" text-anchor="middle">GET /any-path</text>
  <text x="110" y="453" font-size="10.5" fill="#8a8a8a" text-anchor="middle">→ 404</text>

  <rect x="280" y="404" width="240" height="56" rx="8" fill="#ffffff" stroke="#c9c9c9"/>
  <text x="400" y="427" font-size="12.5" font-weight="600" fill="#333" text-anchor="middle">public/404.html</text>
  <text x="400" y="444" font-size="10.5" fill="#777" text-anchor="middle">pathSegmentsToKeep = 0 (user site)</text>

  <line x1="520" y1="424" x2="520" y2="360" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="536" y="396" font-size="10.5" fill="#8a8a8a">redirect to /?/any-path</text>

  <rect x="430" y="296" width="250" height="60" rx="8" fill="#ffffff" stroke="#c9c9c9"/>
  <text x="555" y="320" font-size="12.5" font-weight="600" fill="#333" text-anchor="middle">index.html</text>
  <text x="555" y="338" font-size="10.5" fill="#777" text-anchor="middle">decode script: history.replaceState</text>

  <line x1="680" y1="326" x2="768" y2="326" stroke="#0d9488" stroke-width="1.5" marker-end="url(#arrowTeal)"/>
  <text x="724" y="316" font-size="10.5" fill="#0d9488" text-anchor="middle">clean URL</text>

  <rect x="770" y="296" width="220" height="60" rx="8" fill="#f0fdfa" stroke="#0d9488"/>
  <text x="880" y="320" font-size="12.5" font-weight="600" fill="#0f766e" text-anchor="middle">React Router 6</text>
  <text x="880" y="338" font-size="10.5" fill="#4d9a94" text-anchor="middle">"/" → Index · "*" → NotFound</text>

  <text x="40" y="472" font-size="10.5" fill="#999">Pages has no SPA rewrites: unknown paths hit 404.html, which encodes the route into the query string; index.html restores it before React mounts.</text>

  <!-- ============ Band 3: Application structure ============ -->
  <rect x="20" y="506" width="1000" height="478" rx="12" fill="#fafafa" stroke="#e6e6e6"/>
  <text x="36" y="532" font-size="15" font-weight="700" fill="#0d9488">3 · APPLICATION STRUCTURE</text>

  <rect x="40" y="556" width="150" height="50" rx="8" fill="#ffffff" stroke="#c9c9c9"/>
  <text x="115" y="578" font-size="12.5" font-weight="600" fill="#333" text-anchor="middle">src/main.tsx</text>
  <text x="115" y="595" font-size="10.5" fill="#777" text-anchor="middle">mounts App into #root</text>

  <line x1="190" y1="581" x2="248" y2="581" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="250" y="548" width="740" height="66" rx="8" fill="#ffffff" stroke="#c9c9c9"/>
  <text x="620" y="572" font-size="12.5" font-weight="600" fill="#333" text-anchor="middle">src/App.tsx — providers &amp; routing</text>
  <text x="620" y="592" font-size="10.5" fill="#777" text-anchor="middle">QueryClientProvider · TooltipProvider · Toaster / Sonner · BrowserRouter (no basename — root site)</text>

  <line x1="480" y1="614" x2="400" y2="648" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="415" y="636" font-size="10" fill="#8a8a8a">route "/"</text>
  <line x1="880" y1="614" x2="880" y2="648" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="896" y="636" font-size="10" fill="#8a8a8a">route "*"</text>

  <!-- Index page box with section chips -->
  <rect x="40" y="650" width="700" height="200" rx="8" fill="#ffffff" stroke="#c9c9c9"/>
  <text x="390" y="674" font-size="12.5" font-weight="600" fill="#333" text-anchor="middle">pages/Index.tsx — one scrolling page, sections in order (nav = smooth scroll to #ids)</text>

  <rect x="60" y="688" width="90" height="28" rx="14" fill="#f2f2f2" stroke="#dddddd"/>
  <text x="105" y="706" font-size="10.5" fill="#555" text-anchor="middle">Header (fixed)</text>
  <rect x="160" y="688" width="70" height="28" rx="14" fill="#f0fdfa" stroke="#5eead4"/>
  <text x="195" y="706" font-size="10.5" fill="#0f766e" text-anchor="middle">Hero</text>
  <rect x="240" y="688" width="70" height="28" rx="14" fill="#f0fdfa" stroke="#5eead4"/>
  <text x="275" y="706" font-size="10.5" fill="#0f766e" text-anchor="middle">About</text>
  <rect x="320" y="688" width="94" height="28" rx="14" fill="#f0fdfa" stroke="#5eead4"/>
  <text x="367" y="706" font-size="10.5" fill="#0f766e" text-anchor="middle">Experience</text>
  <rect x="424" y="688" width="70" height="28" rx="14" fill="#f0fdfa" stroke="#5eead4"/>
  <text x="459" y="706" font-size="10.5" fill="#0f766e" text-anchor="middle">Skills</text>
  <rect x="504" y="688" width="80" height="28" rx="14" fill="#f0fdfa" stroke="#5eead4"/>
  <text x="544" y="706" font-size="10.5" fill="#0f766e" text-anchor="middle">Projects</text>
  <rect x="594" y="688" width="88" height="28" rx="14" fill="#f0fdfa" stroke="#5eead4"/>
  <text x="638" y="706" font-size="10.5" fill="#0f766e" text-anchor="middle">Education</text>

  <rect x="60" y="726" width="76" height="28" rx="14" fill="#f0fdfa" stroke="#5eead4"/>
  <text x="98" y="744" font-size="10.5" fill="#0f766e" text-anchor="middle">Contact</text>
  <rect x="146" y="726" width="110" height="28" rx="14" fill="#f0fdfa" stroke="#5eead4"/>
  <text x="201" y="744" font-size="10.5" fill="#0f766e" text-anchor="middle">Achievements</text>
  <rect x="266" y="726" width="80" height="28" rx="14" fill="#f0fdfa" stroke="#5eead4"/>
  <text x="306" y="744" font-size="10.5" fill="#0f766e" text-anchor="middle">Hobbies</text>
  <rect x="356" y="726" width="90" height="28" rx="14" fill="#f2f2f2" stroke="#dddddd"/>
  <text x="401" y="744" font-size="10.5" fill="#555" text-anchor="middle">Footer (fixed)</text>
  <rect x="456" y="726" width="200" height="28" rx="14" fill="#fdf4f4" stroke="#e5c3c3" stroke-dasharray="4 3"/>
  <text x="556" y="744" font-size="10.5" fill="#9a6262" text-anchor="middle">ResumeSection (unused, dead code)</text>

  <rect x="60" y="770" width="660" height="64" rx="8" fill="#f0fdfa" stroke="#0d9488"/>
  <text x="390" y="794" font-size="12" font-weight="600" fill="#0f766e" text-anchor="middle">Content model — hardcoded data arrays inside each section component</text>
  <text x="390" y="814" font-size="10.5" fill="#4d9a94" text-anchor="middle">experiences[] · skillCategories[] · projects[] · education[] · achievements[] · hobbies[] — no data files, no CMS</text>
  <line x1="390" y1="756" x2="390" y2="768" stroke="#0d9488" stroke-width="1.5" marker-end="url(#arrowTeal)"/>

  <!-- NotFound -->
  <rect x="790" y="650" width="180" height="56" rx="8" fill="#ffffff" stroke="#c9c9c9"/>
  <text x="880" y="673" font-size="12.5" font-weight="600" fill="#333" text-anchor="middle">pages/NotFound.tsx</text>
  <text x="880" y="690" font-size="10.5" fill="#777" text-anchor="middle">branded 404 (path echo, home/back CTAs)</text>

  <!-- External services -->
  <rect x="770" y="726" width="220" height="124" rx="8" fill="#ffffff" stroke="#c9c9c9" stroke-dasharray="4 3"/>
  <text x="880" y="748" font-size="12" font-weight="600" fill="#333" text-anchor="middle">External services</text>
  <text x="880" y="770" font-size="10.5" fill="#777" text-anchor="middle">Web3Forms API (contact form)</text>
  <text x="880" y="788" font-size="10.5" fill="#777" text-anchor="middle">Google Drive (resume download)</text>
  <text x="880" y="806" font-size="10.5" fill="#777" text-anchor="middle">LinkedIn · GitHub · mailto</text>
  <text x="880" y="824" font-size="10.5" fill="#777" text-anchor="middle">cinema-hub (Hobbies link)</text>
  <text x="880" y="842" font-size="9.5" fill="#999" text-anchor="middle">the only outbound calls/links in the app</text>
  <line x1="740" y1="740" x2="768" y2="748" stroke="#8a8a8a" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Cross-repo note -->
  <rect x="40" y="866" width="950" height="100" rx="8" fill="#fffbeb" stroke="#f1d992"/>
  <text x="60" y="892" font-size="12" font-weight="600" fill="#92700c">Cross-repo contract — About.tsx is a source of truth</text>
  <text x="60" y="914" font-size="10.5" fill="#8a7434">The About Me card in the cinema-hub repo (/Users/shoaib.rayeen/my_space/cinema-hub, live at shoaibrayeen.github.io/cinema-hub/) must always</text>
  <text x="60" y="931" font-size="10.5" fill="#8a7434">mirror this site's About section. Whenever About.tsx (or the bio in Hero.tsx) changes, update cinema-hub's src/pages/Index.tsx About Me card to match.</text>
  <text x="60" y="948" font-size="10.5" fill="#8a7434">Rules live in both repos' CLAUDE.md files. This portfolio is always the source; never edit it to match cinema-hub.</text>
</svg>
